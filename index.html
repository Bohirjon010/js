<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .message {
        color: #000;
        font-family: sans-serif;
        width: 300px;

        text-align: center;
        font-size: 15px;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        height: 100vh;
      }

      h1 {
        font-size: 70px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      input {
        border: none;
        background: #aeaeaee5;
        width: 200px;
        height: 30px;
        border-radius: 30px;

        padding-left: 30px;
        padding-right: 20px;
        font-size: 20px;
      }
      input:focus {
        border: none;
        outline: none;
      }
      button {
        width: 150px;
        height: 30px;
        border: none;
        border-radius: 20px;
        background: blue;
        color: #fff;
        margin-left: auto;
        margin-right: auto;
        font-size: 20px;

        margin-bottom: 20px;
      }
      .s {
        border: 5px solid greenyellow;
        box-shadow: 3px 4px 29px 3px rgba(0, 255, 8, 0.71);
        -webkit-box-shadow: 3px 4px 29px 3px rgba(0, 255, 8, 0.71);
        -moz-box-shadow: 3px 4px 29px 3px rgba(0, 255, 8, 0.71);
      }
      .e {
        border: 5px solid tomato;
        box-shadow: 3px 4px 29px 3px rgba(255, 0, 0, 0.71);
        -webkit-box-shadow: 3px 4px 29px 3px rgba(255, 0, 0, 0.71);
        -moz-box-shadow: 3px 4px 29px 3px rgba(255, 0, 0, 0.71);
      }
    </style>
  </head>
  <body>
    <h1>regEX</h1>
    <form action="" id="signup-form">
      <input type="password" placeholder="username" id="username" />
      <button type="submit">submit</button>
    </form>
    <div class="message">
      Kirityotgan ma'lumotingiz 6 dan kotta, 12 dan kichik bolsin.
    </div>
    <!-- JS -->
    <script src="./app.js"></script>
  </body>
</html>
